name: Deploy Elevora

# Auto-deploys the web admin to the server on every push to main.
# Build (Vite) -> rsync frontend/dist to the nginx webroot.
# Requires repo secret: SSH_PRIVATE_KEY (private key for root@cranberry).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_HOST: 178.18.251.26
  SSH_USER: root
  WEBROOT: /var/www/hani-yousif/elevora
  URL: https://elevora.hani-yousif.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (rsync)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            frontend/dist/ "$SSH_USER@$SSH_HOST:$WEBROOT/"

      - name: Verify
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Live check: HTTP $code  $URL"
          test "$code" = "200"
